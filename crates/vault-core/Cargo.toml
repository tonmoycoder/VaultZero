[package]
name = "vault-core"
version = "0.1.0"
edition = "2021"
description = "Pure Rust cryptographic core, storage engine, and CRDT synchronization for VaultZero"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = { version = "0.8", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
uuid = { version = "1.11", features = ["v4", "serde"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hkdf = "0.12"
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "getrandom"] }
subtle = "2.6"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
regex = "1.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory", "Win32_System_Threading"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.16"
