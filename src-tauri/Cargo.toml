[package]
name = "vaultzero-app"
version = "2.5.2"
description = "VaultZero Tauri application"
edition = "2021"

[lib]
name = "vaultzero_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
vault-core = { path = "../crates/vault-core" }
tauri = { version = "2.2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# V-78: only the features actually used by the opt-in LAN P2P host:
#   tokio::spawn / Mutex / TcpListener / AsyncRead+AsyncWrite / sleep / select!
# "full" also pulls fs, process, signal and extra drivers into the binary for
# no reason. Air-seal scope (crates/vault-core) remains network-free.
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
uuid = { version = "1.11", features = ["v4"] }
chrono = "0.4"
regex = "1.10"
mdns-sd = "0.13"
tokio-tungstenite = "0.26"
futures-util = "0.3"
subtle = "2.5"
rmp-serde = "1.3"
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "getrandom"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse"
] }
