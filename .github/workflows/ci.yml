name: Continuous Integration

on:
  push:
    branches: [ main, master, "arena/**" ]
  pull_request:
    branches: [ main, master, "arena/**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Test & Build Verification
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      # V-96: `npm run build` is a Vite transpile, NOT a type check. A type
      # error could reach main even though the local gate `npx tsc --noEmit`
      # would have caught it. CI now enforces the same contract.
      - name: Verify TypeScript (no emit)
        run: npx tsc --noEmit

      - name: Verify TypeScript & Frontend Build
        run: npm run build

      # UX: every colour token of every theme has to clear the WCAG 2.1 AA
      # contrast threshold on every surface it is drawn on. Three status
      # colours of the light theme were below the threshold, which is what
      # made the status unreadable.
      - name: Check Theme Contrast
        run: node scripts/check-contrast.mjs

      # PERFORMANCE: the heavy payloads have to stay out of the initial
      # download. The TOTP chunk used to carry the OCR language table, and
      # the QR decoder used to be part of the first paint.
      - name: Check Bundle Budget
        run: node scripts/check-bundle-size.mjs

      # The browserless harnesses exercise the security-critical logic
      # (storage, KDF, updater, breach scanner, URL sanitiser) without a
      # browser, so they run on every CI machine — including ones where
      # the Playwright browser download is blocked.
      - name: Build Test Bundles
        run: npm run build:test-bundles

      - name: Run Browserless Verification Harnesses
        run: npm run test:harness

      # Keep the harness output even when a step fails, so a red build can
      # be diagnosed without re-running it locally.
      - name: Upload Harness Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-log
          path: |
            .harness-build/
          retention-days: 7
          if-no-files-found: ignore

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      # `cargo fmt --all -- --check` is the canonical gate, but it needs a
      # Rust toolchain and its result shifts between rustfmt releases. The
      # check below runs the same formatter through WebAssembly, so it is
      # reproducible everywhere and does not depend on the toolchain
      # version that happens to be installed.
      - name: Check Rust Formatting
        run: node scripts/check-rust-format.mjs

      # The toolchain check still runs, because a formatting pass that the
      # toolchain disagrees with would be caught here.
      - name: Check Rust Formatting with the toolchain
        run: cargo fmt --all -- --check

      - name: Run Cargo Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Cargo Test Suite
        run: cargo test -p vault-core --verbose

      - name: Audit Rust Dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Audit Frontend Dependencies
        run: npm audit --audit-level=high

  frontend-e2e:
    name: Frontend End-to-End & Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Test Suite
        run: npx playwright test --reporter=list

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            .artifacts/test-results/
          retention-days: 7
          if-no-files-found: ignore
