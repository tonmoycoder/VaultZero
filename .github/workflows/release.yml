name: Release (Windows Installer & Android APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.1)'
        required: false
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer & Portable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Setup Rust Stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Web Application
        run: npm run build

      - name: Build Tauri Windows Installer & Executable
        run: npx tauri build

      - name: Prepare Windows Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets-windows -Force
          
          # Find and copy NSIS installer (.setup.exe or .exe in nsis bundle)
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "release-assets-windows/$($_.Name)" -Force
            Write-Host "Found NSIS Installer: $($_.Name)"
          }
          
          # Find and copy MSI installer (.msi in msi bundle)
          Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "release-assets-windows/$($_.Name)" -Force
            Write-Host "Found MSI Installer: $($_.Name)"
          }
          
          # Copy standalone portable executable + manifest
          if (Test-Path "src-tauri/target/release/vaultzero-app.exe") {
            Copy-Item "src-tauri/target/release/vaultzero-app.exe" -Destination "release-assets-windows/VaultZero-Windows-x64-portable.exe" -Force
          }
          if (Test-Path "src-tauri/vaultzero-app.exe.manifest") {
            Copy-Item "src-tauri/vaultzero-app.exe.manifest" -Destination "release-assets-windows/VaultZero-Windows-x64-portable.exe.manifest" -Force
          }
          
          # Generate SHA256 checksums
          Get-ChildItem -Path "release-assets-windows/*" -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            Set-Content -Path "$($_.FullName).sha256" -Value "$hash  $($_.Name)"
            Write-Host "Checksum for $($_.Name): $hash"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VaultZero-Windows-Release
          path: release-assets-windows/*

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        id: setup-android
        uses: android-actions/setup-android@v3

      - name: Setup Rust Stable & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Web Application
        run: npm run build

      - name: Prepare Mobile Assets & PWA Package
        run: |
          mkdir -p release-assets-android
          cd dist && zip -r ../release-assets-android/VaultZero-Mobile-PWA.zip . && cd ..

      - name: Initialize & Build Android APK
        env:
          NDK_HOME: ${{ steps.setup-android.outputs.ANDROID_NDK_HOME }}
        run: |
          echo "Initializing Tauri Android if needed..."
          npx tauri android init || true
          echo "Building Android APK..."
          npx tauri android build --apk || true
          
          # Collect generated APKs
          find src-tauri/gen/android -name "*.apk" -exec cp {} release-assets-android/ \; || true
          
          cd release-assets-android
          sha256sum * > SHA256SUMS.txt || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VaultZero-Android-Release
          path: release-assets-android/*

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: VaultZero-Windows-Release
          path: release-dist

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: VaultZero-Android-Release
          path: release-dist

      - name: List Release Files
        run: ls -la release-dist

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

