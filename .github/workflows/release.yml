name: Release (Windows Installer & Android APK)

# V-63 / V-64 — one stable, documented asset contract.
#
# The in-app updater (`src/lib/updater.ts`) and the README both point at
# `/releases/latest/download/<name>`. Those names are NOT free to change:
# the release job must produce exactly the ones below, every single time,
# or the "Download latest" buttons and the automatic updater break.
#
#   VaultZero-Windows-x64-Setup.exe       NSIS installer (desktop default)
#   VaultZero-Windows-x64-Portable.exe    standalone .exe (no install)
#   VaultZero-Windows-x64.msi             MSI (enterprise / silent install)
#   VaultZero-Android.apk                 signed arm64 APK (stable URL)
#   VaultZero-<TAG>-Android-arm64.apk     versioned copy of the same APK
#   SHA256SUMS.txt                        ONE combined manifest (sha256sum)
#
# The two build jobs must never each write their own SHA256SUMS.txt: the
# second upload silently overwrote the first, so the updater could only
# verify half of the assets. The manifest is built once in publish-release,
# after both artifacts have been downloaded.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing or new release tag (e.g. v2.5.2)'
        required: true
        default: 'v2.5.2'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer & Portable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Setup Rust Stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Web Application
        run: npm run build

      - name: Regenerate installer icons from the single canonical source
        run: npx tauri icon public/vaultzero-logo.png

      - name: Build Tauri Windows Installer & Executable
        run: npx tauri build

      - name: Prepare Stable Windows Release Assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release-assets-windows -Force | Out-Null

          # V-81: `**/bundle/...` does NOT recurse in PowerShell 7 and returned
          # $null even though Tauri produced
          # `target/release/bundle/nsis/VaultZero_2.5.2_x64-setup.exe`.
          # Use explicit, known output directories instead (fail-closed).
          $nsis = @(
            Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue
          ) | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer was not produced by tauri build." }
          Copy-Item $nsis.FullName -Destination "release-assets-windows/VaultZero-Windows-x64-Setup.exe" -Force
          Write-Host "NSIS installer -> VaultZero-Windows-x64-Setup.exe ($($nsis.Name))"

          $msi = @(
            Get-ChildItem -Path "target/release/bundle/msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue
            Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue
          ) | Select-Object -First 1
          if (-not $msi) { throw "MSI installer was not produced by tauri build." }
          Copy-Item $msi.FullName -Destination "release-assets-windows/VaultZero-Windows-x64.msi" -Force
          Write-Host "MSI installer -> VaultZero-Windows-x64.msi ($($msi.Name))"

          $portable = $null
          if (Test-Path "target/release/vaultzero-app.exe") {
            $portable = "target/release/vaultzero-app.exe"
          } elseif (Test-Path "src-tauri/target/release/vaultzero-app.exe") {
            $portable = "src-tauri/target/release/vaultzero-app.exe"
          }
          if (-not $portable) { throw "Standalone portable .exe was not produced by tauri build." }
          Copy-Item $portable -Destination "release-assets-windows/VaultZero-Windows-x64-Portable.exe" -Force
          Write-Host "Portable executable -> VaultZero-Windows-x64-Portable.exe"

          if (Test-Path "src-tauri/vaultzero-app.exe.manifest") {
            Copy-Item "src-tauri/vaultzero-app.exe.manifest" -Destination "release-assets-windows/VaultZero-Windows-x64-Portable.exe.manifest" -Force
          }

          # No SHA256SUMS.txt here. The single combined manifest is written
          # in publish-release after BOTH platform jobs have finished.
          Get-ChildItem -Path "release-assets-windows/*" -File | ForEach-Object {
            Write-Host ("{0}  {1} bytes" -f $_.Name, $_.Length)
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VaultZero-Windows-Release
          path: release-assets-windows/*
          if-no-files-found: error

  build-android:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"
            NDK_DIR="/usr/local/lib/android/sdk/ndk/26.1.10909125"
          fi
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Setup Rust Stable & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Web Application
        run: npm run build

      - name: Initialize & Build Real Signed Android APK
        env:
          CI: true
          # SECURITY (V-31): long-lived Android upload key. A fresh keystore
          # per release would break in-place updates and destroy app data.
          ANDROID_KEYSTORE_BASE64: ${{ secrets['ANDROID_KEYSTORE_BASE64'] }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets['ANDROID_KEYSTORE_PASSWORD'] }}
          ANDROID_KEY_ALIAS: ${{ secrets['ANDROID_KEY_ALIAS'] }}
          ANDROID_KEY_PASSWORD: ${{ secrets['ANDROID_KEY_PASSWORD'] }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::Android signing secrets are not configured."
            echo "::error::Required: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            exit 1
          fi

          # V-64: `tauri android init` FAILS when gen/android already exists.
          # The old `|| true` hid both that harmless error AND real init
          # failures. Only run it when the project is genuinely uninitialised.
          # V-79: Tauri generates Android launcher icons from src-tauri/icons.
          # Regenerating them from the SAME file as the Windows .ico keeps the
          # APK and the .exe visually identical.
          npx tauri icon public/vaultzero-logo.png
          if [ ! -d src-tauri/gen/android ]; then
            echo "Initializing Tauri Android target..."
            npx tauri android init --ci
          else
            echo "Tauri Android target already initialised; skipping init."
          fi

          # V-75: the generated project is recreated on every CI run. Inject
          # CAMERA + local-LAN permissions into its manifest before building;
          # without them getUserMedia is denied and P2P discovery cannot bind.
          node scripts/patch-android-manifest.mjs

          mkdir -p release-assets-android
          echo "Building signed Android release APK for aarch64..."
          npx tauri android build --apk --target aarch64 --ci

          APK_FOUND=$(find src-tauri -type f -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -z "$APK_FOUND" ]; then
            echo "aarch64 build produced no APK; retrying with the universal target..."
            npx tauri android build --apk --ci
            APK_FOUND=$(find src-tauri -type f -name "*.apk" 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$APK_FOUND" ]; then
            echo "::error::No Android APK was produced. Refusing to publish an empty release."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "Restored the long-lived release signing keystore."

          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          if [ ! -x "$BUILD_TOOLS_DIR/zipalign" ] || [ ! -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            echo "::error::Android build-tools (zipalign / apksigner) are missing."
            exit 1
          fi

          echo "Processing APK: $APK_FOUND"
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$APK_FOUND" aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out release-assets-android/VaultZero-Android.apk \
            aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose release-assets-android/VaultZero-Android.apk
          echo "APK signed and verified with the long-lived release key."

          # The versioned name uses the ACTUAL tag, never a hardcoded one.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          cp release-assets-android/VaultZero-Android.apk \
             "release-assets-android/VaultZero-${TAG}-Android-arm64.apk"

          rm -f aligned.apk release.keystore
          ls -la release-assets-android

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VaultZero-Android-Release
          path: release-assets-android/*
          if-no-files-found: error

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: VaultZero-Windows-Release
          path: release-dist

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: VaultZero-Android-Release
          path: release-dist

      - name: Build ONE Combined Checksum Manifest
        run: |
          set -euo pipefail
          for required in \
            "VaultZero-Windows-x64-Setup.exe" \
            "VaultZero-Windows-x64-Portable.exe" \
            "VaultZero-Windows-x64.msi" \
            "VaultZero-Android.apk"; do
            if [ ! -f "release-dist/$required" ]; then
              echo "::error::Required release asset is missing: $required"
              exit 1
            fi
          done

          cd release-dist
          # Exclude any previously uploaded manifest from its own input.
          files=$(find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' | sort)
          : > SHA256SUMS.txt
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            hash=$(sha256sum "$file" | cut -d' ' -f1)
            printf '%s  %s\n' "$hash" "$file" >> SHA256SUMS.txt
          done <<< "$files"
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release & Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            echo "::error::Cannot determine a release tag. Pass tag_name on workflow_dispatch."
            exit 1
          fi
          echo "Publishing release for tag: $TAG"

          # V-72: this project is still in development, so a `-beta` tag is
          # published as a clearly named BETA preview. It deliberately stays
          # on the `latest` channel (the prerelease flag is NOT set) because README and the
          # in-app updater both resolve `/releases/latest/download/<name>`;
          # marking it prerelease would make those links 404 again.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$TAG" == *beta* ]]; then
              gh release create "$TAG" \
                --title "VaultZero $TAG - BETA (Development Preview)" \
                --notes "BETA / development preview - not a production release. Windows installers and the signed Android APK are built from this exact commit and verified against SHA256SUMS.txt. Expect rough edges; report issues on the repository." \
                --target "$GITHUB_SHA" --latest
            else
              gh release create "$TAG" --title "VaultZero $TAG" --generate-notes --target "$GITHUB_SHA" --latest
            fi
          else
            # Idempotency: a re-run of an existing beta tag must keep the BETA label.
            if [[ "$TAG" == *beta* ]]; then
              gh release edit "$TAG" --title "VaultZero $TAG - BETA (Development Preview)"
            fi
          fi

          for file in release-dist/*; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            echo "Uploading $filename..."
            asset_id=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG/assets" \
                       --jq ".[] | select(.name==\"$filename\") | .id" 2>/dev/null || true)
            if [ -n "$asset_id" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$asset_id" >/dev/null
              sleep 1
            fi
            # No `|| true`: a failed upload must fail the release.
            gh release upload "$TAG" "$file" --clobber
          done

          echo "Verifying the published asset contract..."
          names=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG/assets" --jq '.[].name')
          for required in \
            "VaultZero-Windows-x64-Setup.exe" \
            "VaultZero-Windows-x64-Portable.exe" \
            "VaultZero-Windows-x64.msi" \
            "VaultZero-Android.apk" \
            "SHA256SUMS.txt"; do
            if ! echo "$names" | grep -Fxq "$required"; then
              echo "::error::Published release is missing $required"
              exit 1
            fi
          done
          echo "All stable release assets verified for $TAG."
