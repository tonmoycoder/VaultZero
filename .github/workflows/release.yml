name: Release (Windows Installer & Android APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.1)'
        required: false
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer & Portable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Setup Rust Stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Web Application
        run: npm run build

      - name: Build Tauri Windows Installer & Executable
        run: npx tauri build

      - name: Prepare Windows Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets-windows -Force
          
          # Find and copy NSIS installer (.setup.exe or .exe in nsis bundle)
          Get-ChildItem -Path "**/bundle/nsis/*.exe" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "release-assets-windows/$($_.Name)" -Force
            Write-Host "Found NSIS Installer: $($_.Name)"
          }
          
          # Find and copy MSI installer (.msi in msi bundle)
          Get-ChildItem -Path "**/bundle/msi/*.msi" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "release-assets-windows/$($_.Name)" -Force
            Write-Host "Found MSI Installer: $($_.Name)"
          }
          
          # Copy standalone portable executable + manifest (check both workspace root and sub-crate target)
          if (Test-Path "target/release/vaultzero-app.exe") {
            Copy-Item "target/release/vaultzero-app.exe" -Destination "release-assets-windows/VaultZero-Windows-x64-portable.exe" -Force
            Write-Host "Found portable executable in target/release"
          } elseif (Test-Path "src-tauri/target/release/vaultzero-app.exe") {
            Copy-Item "src-tauri/target/release/vaultzero-app.exe" -Destination "release-assets-windows/VaultZero-Windows-x64-portable.exe" -Force
            Write-Host "Found portable executable in src-tauri/target/release"
          }
          if (Test-Path "src-tauri/vaultzero-app.exe.manifest") {
            Copy-Item "src-tauri/vaultzero-app.exe.manifest" -Destination "release-assets-windows/VaultZero-Windows-x64-portable.exe.manifest" -Force
          }
          
          # Generate SHA256 checksums.
          #
          # SECURITY (V-32): the desktop release publishes a single
          # `SHA256SUMS.txt` manifest in the `sha256sum` format. The app
          # downloads this manifest, parses the entry for the artifact it is
          # about to install, and refuses the download if the digests do not
          # match. The per-file `.sha256` sidecars are kept for people who
          # download a single file by hand.
          Get-ChildItem -Path "release-assets-windows/*" -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            Set-Content -Path "$($_.FullName).sha256" -Value "$hash  $($_.Name)"
            Write-Host "Checksum for $($_.Name): $hash"
          }
          # Build the combined manifest. Only the real artifacts are listed
          # — the `.sha256` sidecars themselves must not be listed.
          $manifestLines = Get-ChildItem -Path "release-assets-windows/*" -File |
            Where-Object { $_.Extension -ne ".sha256" } |
            ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            }
          Set-Content -Path "release-assets-windows/SHA256SUMS.txt" -Value $manifestLines -Encoding ascii
          Write-Host "Wrote SHA256SUMS.txt with $($manifestLines.Count) entries"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VaultZero-Windows-Release
          path: release-assets-windows/*

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"
            NDK_DIR="/usr/local/lib/android/sdk/ndk/26.1.10909125"
          fi
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Setup Rust Stable & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Web Application
        run: npm run build

      - name: Initialize & Build Real Android APK
        env:
          CI: true
          # SECURITY (V-31): the long-lived Android release signing material.
          # These are repository secrets and are never written to the log.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release-assets-android
          echo "Initializing Tauri Android target..."
          npx tauri android init --ci || true

          echo "Building Android release APK for aarch64..."
          npx tauri android build --apk --target aarch64 --ci || true

          # If target build produces APKs, locate, sign, and verify
          APK_FOUND=$(find src-tauri -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "Building universal Android APK..."
            npx tauri android build --apk --ci || true
          fi

          # SECURITY (V-31): use a LONG-LIVED signing key stored as a
          # repository secret. The previous implementation generated a fresh
          # keystore on every release with a hardcoded, public password:
          #
          #   * the password was in the public repository;
          #   * every release produced a DIFFERENT signing identity, so
          #     Android refused to update an existing install ("package not
          #     signed with the same key") and forced users to uninstall —
          #     losing all app data — on every single release;
          #   * anyone could produce an APK that Android accepted as the
          #     official VaultZero build.
          #
          # The job now FAILS LOUDLY if the secret is missing, rather than
          # silently falling back to a throwaway key.
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are not configured."
            echo "::error::Required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
            echo "::error::Generate a long-lived upload key once (see docs/ANTIGRAVITY-BRIEF.md, finding V-31) and store it as a GitHub Actions secret."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "Restored the long-lived release signing keystore."

          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"

          for raw_apk in $(find src-tauri -name "*.apk" 2>/dev/null); do
            echo "Processing and signing APK: $raw_apk"
            if [ -f "$BUILD_TOOLS_DIR/zipalign" ]; then
              $BUILD_TOOLS_DIR/zipalign -v -p 4 "$raw_apk" aligned.apk 2>/dev/null || cp "$raw_apk" aligned.apk
            else
              cp "$raw_apk" aligned.apk
            fi

            if [ -f "$BUILD_TOOLS_DIR/apksigner" ]; then
              $BUILD_TOOLS_DIR/apksigner sign \
                --ks release.keystore \
                --ks-key-alias "$ANDROID_KEY_ALIAS" \
                --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
                --key-pass "pass:$ANDROID_KEY_PASSWORD" \
                --out release-assets-android/VaultZero-Android.apk \
                aligned.apk
              cp release-assets-android/VaultZero-Android.apk release-assets-android/VaultZero-v2.5.2-Android-arm64.apk
              echo "Successfully signed VaultZero-Android.apk with the long-lived release key!"
            else
              echo "::error::apksigner not found — refusing to publish an unsigned APK."
              exit 1
            fi
            rm -f aligned.apk
            break
          done

          # Never leave the signing material in the workspace.
          rm -f release.keystore

          # SECURITY (V-32): publish one `SHA256SUMS.txt` manifest in the
          # `sha256sum` format. Only the real artifacts are listed — the
          # `.sha256` sidecars must not list themselves.
          cd release-assets-android
          sha256sum $(ls | grep -v '\.sha256$' | grep -v '^SHA256SUMS\.txt$') > SHA256SUMS.txt 2>/dev/null || true
          ls -la

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VaultZero-Android-Release
          path: release-assets-android/*

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: VaultZero-Windows-Release
          path: release-dist

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: VaultZero-Android-Release
          path: release-dist

      - name: List Release Files
        run: ls -la release-dist

      - name: Create or Update GitHub Release & Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v2.5.2"
          fi
          echo "Processing release for tag: $TAG"
          gh release view "$TAG" 2>/dev/null || gh release create "$TAG" --title "VaultZero $TAG — Real Android APK Pipeline, 122% Font Baseline & Auto-Updater" --generate-notes
          echo "Uploading release assets with conflict-free per-asset overwrite..."
          for file in release-dist/*; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            echo "Checking and clearing existing asset $filename if present..."
            asset_id=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG/assets" --jq ".[] | select(.name==\"$filename\") | .id" 2>/dev/null || true)
            if [ -n "$asset_id" ]; then
              echo "Found existing asset $filename (ID: $asset_id), deleting via GitHub API..."
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$asset_id" 2>/dev/null || true
              sleep 1
            fi
            echo "Uploading $filename..."
            gh release upload "$TAG" "$file" --clobber || {
              echo "Retrying $filename after delay..."
              sleep 2
              gh release upload "$TAG" "$file" --clobber || true
            }
          done
          echo "All release assets uploaded successfully for $TAG."

