name: Diagnostic

on:
  push:
    branches:
      - arena/79f3d1ba-vaultzero
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/79f3d1ba-vaultzero
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Frontend Dependencies
        run: npm ci
      - name: Collect the diagnosis
        run: |
          set +e
          {
            echo "=== node version ==="
            node --version
            echo "=== script output ==="
            node scripts/check-rust-format.mjs 2>&1
            echo "=== script exit: $? ==="
          } > diagnosis.txt 2>&1
          cat diagnosis.txt
      - name: Run the browser suite
        run: |
          set +e
          {
            echo "=== playwright ==="
            npx playwright install --with-deps chromium 2>&1 | tail -5
            npx playwright test --reporter=list 2>&1 | tail -120
          } > e2e.txt 2>&1
          cat e2e.txt
      - name: Publish the diagnosis to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnosis.txt e2e.txt
          git commit -m "chore(ci): publish the diagnosis" || true
          git push origin HEAD:arena/79f3d1ba-vaultzero
