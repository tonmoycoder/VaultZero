name: Harness Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [ arena/79f3d1ba-vaultzero ]
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run build:test-bundles
      - name: Capture the environment
        run: |
          {
            echo "node: $(node --version)"
            echo "platform: $(node -e 'console.log(process.platform, process.arch)')"
            echo "cwd: $(pwd)"
            echo "--- dist listing ---"
            dir dist
            echo "--- index.html ---"
            type dist\index.html
          } > harness-diag.txt 2>&1
      # Every harness gets its own step, so a failure names the harness
      # instead of only reporting "the suite failed".
      - name: harness url-sanitizer
        run: node tests/harness/url-sanitizer.test.mjs
      - name: harness storage-security
        run: node tests/harness/storage-security.test.mjs
      - name: harness autolock
        run: node tests/harness/autolock.test.mjs
      - name: harness breach
        run: node tests/harness/breach.test.mjs
      - name: harness round2
        run: node tests/harness/round2.test.mjs
      - name: harness copyall
        run: node tests/harness/copyall.test.mjs
      - name: harness argon-perf
        run: node tests/harness/argon-perf.test.mjs
      - name: harness argon-recovery
        run: node tests/harness/argon-recovery.test.mjs
      - name: harness lock-flush
        run: node tests/harness/lock-flush.test.mjs
      - name: harness legacy-migration
        run: node tests/harness/legacy-migration.test.mjs
      - name: harness checksum-e2e
        run: node tests/harness/checksum-e2e.test.mjs
      - name: harness kdf-parity
        run: node tests/harness/kdf-parity.test.mjs
      - name: harness rust-kdf-mirror
        run: node tests/harness/rust-kdf-mirror.test.mjs
      - name: harness keyfile-edge
        run: node tests/harness/keyfile-edge.test.mjs
      - name: harness storage-growth
        run: node tests/harness/storage-growth.test.mjs
      - name: harness brand-mirror
        run: node tests/harness/brand-mirror.test.mjs
      - name: harness prod-bundle
        run: node tests/harness/prod-bundle.test.mjs
      # Break the prod-bundle assertions into separate steps so the CI log
      # names the exact condition that fails on Windows.
      - name: prod-bundle check - dist exists
        run: node -e "const fs=require('fs');console.log('dist:',fs.existsSync('dist'));console.log('assets:',fs.existsSync('dist/assets'))"
      - name: prod-bundle check - chunk inventory
        run: node -e "const fs=require('fs');console.log(fs.readdirSync('dist/assets').filter(f=>f.endsWith('.js')).join('\n'))"
      - name: prod-bundle check - wasm marker
        run: node -e "const fs=require('fs');const p='dist/assets';for(const f of fs.readdirSync(p)){if(!f.endsWith('.js'))continue;const c=fs.readFileSync(p+'/'+f,'utf8').replace(/\s+/g,'');if(c.includes('AGFzbQ'))console.log('wasm in',f);}"
      - name: prod-bundle check - wordlist marker
        run: node -e "const fs=require('fs');const p='dist/assets';for(const f of fs.readdirSync(p)){if(!f.endsWith('.js'))continue;const c=fs.readFileSync(p+'/'+f,'utf8');if(c.includes('abdominal'))console.log('wordlist in',f);}"
      - name: prod-bundle check - preloads
        run: node -e "const fs=require('fs');const h=fs.readFileSync('dist/index.html','utf8');console.log([...h.matchAll(/modulepreload[^>]*href=\x22\.\/assets\/([^\x22]+)\x22/g)].map(m=>m[1]).join('\n'))"
      - name: harness lock-flush-proof
        run: node tests/harness/lock-flush-regression-proof.mjs
      # Keep the output even when a step fails, so the cause is readable
      # from the artifact instead of from a truncated log.
      # The `cargo fmt --check` step in the main workflow does not print a
      # diff on this runner, so capture one explicitly.
      - name: Capture the rustfmt diff
        if: always()
        run: |
          {
            echo "--- rustfmt version ---"
            rustfmt --version
            echo "--- rustfmt check ---"
            cargo fmt --all -- --check 2>&1
          } > rustfmt-diag.txt 2>&1
          exit 0
      - name: Upload the diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-diagnostic
          path: |
            harness-diag.txt
            rustfmt-diag.txt
          retention-days: 7
          if-no-files-found: ignore
