name: Rust Test Diagnostic

on:
  push:
    branches: [ arena/79f3d1ba-vaultzero ]

jobs:
  test:
    name: Rust Test Diagnostic
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      # The report is written into the job summary. The summary is read
      # from the API, so the report can be seen without downloading the
      # log archive.
      - name: Run the tests and capture the report
        run: |
          cargo test -p vault-core --verbose > test-output.txt 2>&1 || true
          {
            echo "## The Rust test report"
            echo ""
            echo '```text'
            grep -v "^   Compiling\|^    Checking\|^ Downloading\|^  Downloaded\|^   Locking\|^ Adding\|^warning: unused" test-output.txt | tail -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # The report is also written onto the branch, because the log
          # archive cannot be downloaded from here and the summary is
          # not readable through the API.
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test-output.txt
          git commit -m "chore: capture the Rust test report" || echo "nothing to commit"
          git push origin HEAD:arena/79f3d1ba-vaultzero
