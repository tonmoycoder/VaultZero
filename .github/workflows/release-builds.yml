name: Release Builds (Windows .exe & Android .apk)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Portable .exe
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Frontend Assets
        run: npm run build

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Standalone Windows Binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Prepare Windows Release Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force
          Copy-Item "target/release/vaultzero-app.exe" -Destination "release-assets/VaultZero-Windows-x64.exe"
          
          # Generate SHA256 checksum
          $hash = (Get-FileHash -Path "release-assets/VaultZero-Windows-x64.exe" -Algorithm SHA256).Hash
          Set-Content -Path "release-assets/VaultZero-Windows-x64.exe.sha256" -Value "$hash  VaultZero-Windows-x64.exe"
          Write-Host "Generated SHA256: $hash"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VaultZero-Windows-x64
          path: release-assets/*

  build-android:
    name: Build Android APK & Mobile Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust Stable & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Prepare Mobile Artifacts
        run: |
          mkdir -p release-assets-android
          # Create PWA bundle for mobile web / offline installation
          cd dist && zip -r ../release-assets-android/VaultZero-Mobile-PWA.zip . && cd ..

      - name: Try Build Android APK (Tauri Android)
        continue-on-error: true
        env:
          NDK_HOME: ${{ steps.setup-android.outputs.ANDROID_NDK_HOME }}
        run: |
          echo "Initializing Android project if not already present..."
          npx tauri android init || true
          echo "Building Android APK..."
          npx tauri android build --apk --split-per-abi || true
          
          # Find generated apks and copy to release-assets-android
          find src-tauri/gen/android -name "*.apk" -exec cp {} release-assets-android/ \; || true

      - name: Compute Android Checksums
        run: |
          cd release-assets-android
          sha256sum * > SHA256SUMS.txt || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VaultZero-Android-Mobile
          path: release-assets-android/*

  publish-github-release:
    name: Publish to GitHub Releases
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: VaultZero-Windows-x64
          path: final-release

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: VaultZero-Android-Mobile
          path: final-release

      - name: Display Release Contents
        run: ls -la final-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-release/*
          generate_release_notes: true
          draft: false
          prerelease: false

