name: Clippy Diagnosis

on:
  push:
    branches:
      - arena/907dafa8-vaultzero
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/907dafa8-vaultzero
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Collect clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings > clippy.txt 2>&1
          echo "=== clippy exit: $? ===" >> clippy.txt
          cat clippy.txt
      - name: Publish the diagnostics to the branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clippy.txt
          git commit -m "chore(ci): publish clippy diagnostics" || true
          git push origin HEAD:arena/907dafa8-vaultzero
